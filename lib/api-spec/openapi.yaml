openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get reporting totals scoped to the signed-in Noon staff member's assigned schools
      responses:
        "200":
          description: Summary or unavailable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /synapse/status:
    get:
      operationId: getSynapseStatus
      tags: [synapse]
      summary: Check the server-side Citadel connection
      responses:
        "200":
          description: Connection state only; no private school data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynapseStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    DashboardSummary:
      type: object
      required: [available, authRequired, syncedAt, windowStart, windowEnd, metrics]
      properties:
        available:
          type: boolean
        authRequired:
          type: boolean
        syncedAt:
          type: [string, "null"]
        windowStart:
          type: [string, "null"]
        windowEnd:
          type: [string, "null"]
        metrics:
          anyOf:
            - type: "null"
            - type: object
              required: [schools, enrolledStudents, managers, schoolLeads, facilitators]
              properties:
                schools: { type: integer }
                enrolledStudents: { type: integer }
                managers: { type: integer }
                schoolLeads: { type: integer }
                facilitators: { type: integer }
    SynapseStatus:
      type: object
      required: [configured, connected, message, authStatus]
      properties:
        configured:
          type: boolean
        connected:
          type: boolean
        message:
          type: string
        authStatus:
          type: string
          enum: [callback_registration_required]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status


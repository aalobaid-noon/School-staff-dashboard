<script>
/* ==========================================================================
   noon · School Manager Dashboard — built on live Athena data
   Every figure comes from DATA (data/real.json), pulled from the Noon data
   lake. No simulated values.
   ========================================================================== */

const M  = DATA.managers;
const C  = DATA.campuses;
const EX = DATA.exams;
const WK = DATA.weekly;
const FA = DATA.facilitators;
const LD = DATA.leads || [];
const GR = DATA.grades || [], CO = DATA.cohorts || [], ST = DATA.students || [];
const ORPH = DATA.orphanCohorts || [];
/* comment row = [campusId, facilitatorId, cohortIdx, week, qFlag, rateIdx, text] */
const CM = DATA.comments || [];
const C_CID=0, C_FID=1, C_CO=2, C_WK=3, C_Q=4, C_R=5, C_TXT=6;
const RATE = [
  {ar:'سيئ جدًا', en:'Very bad', col:'var(--red)',   cls:'p-red'},
  {ar:'سيئ',      en:'Bad',      col:'var(--red)',   cls:'p-red'},
  {ar:'مقبول',    en:'OK',       col:'var(--amber)', cls:'p-amber'},
  {ar:'جيد',      en:'Good',     col:'var(--blue)',  cls:'p-blue'},

    etqs:     wmean(list, 'etqs', 'etn'),
    etn:      wsum(list, 'etn'),
    tr:       wmean(list, 'tr',  'tn'),
    tn:       wsum(list, 'tn')
  };

     n_<k> eligible · sch_<k> schools it is assigned to · <k>o/<k>c opened/completed % · <k>s score */
  EXM.forEach(e => {
    const rs = list.map(c => xr(c.id, e.k)).filter(r => r.n > 0);
    let s = 0, w = 0;
    for(const r of rs){ const wt = r.n * ((r.c || 0) / 100); if(r.s != null && wt > 0){ s += r.s * wt; w += wt; } }
    out['n_' + e.k]   = wsum(rs, 'n');

    out[e.c] = wmean(rs, 'c', 'n');

/* ---------- UI atoms ---------- */
/* The headline value is the average over the whole window; the delta is the
   latest week against the comparison week. Two different measures, so the chip says which
   weeks it compares instead of letting the reader assume it moves the big number. */
function deltaChip(k, cur, base){
  if(!deltasLive()) return '<div class="delta na">' + esc(t('deltaNA')) + '</div>';
  if(cur == null || base == null) return '';
  const raw = cur - base, inv = !!(MET[k] && MET[k].invert);
  const near = Math.abs(raw) < 0.15;
  const good = inv ? raw < 0 : raw > 0;
  const cls = near ? 'flat' : (good ? 'up' : 'down');
  const txt = (raw >= 0 ? '+' : '−') + Math.abs(raw).toFixed(1) + ' ' + t('pts');
  const span = ar() ? ('أ' + CUR_WK + ' ↔ أ' + baseWk()) : ('W' + CUR_WK + '↔W' + baseWk());
  return '<span class="delta ' + cls + '">' + (near ? '' : (raw > 0 ? '▲' : '▼')) + ' ' + bd(txt)
    + ' <span style="opacity:.72;font-weight:600">· ' + bd(span) + '</span></span>'
    + '<div class="note2" style="margin-top:3px">' + (ar() ? 'قيمة الأسبوع ' : 'week ') + bd(CUR_WK) + ': '
    + bd(pc1(cur)) + '</div>';
}
function spark(vals, color){
  const v = vals.filter(x => x != null);
  if(v.length < 2) return '';
  const W = 120, H = 28, p = 2;
  const lo = Math.min(...v), hi = Math.max(...v), rg = (hi - lo) || 1;
  const X = i => p + i * (W - 2*p) / (v.length - 1);
  const Y = x => H - p - ((x - lo) / rg) * (H - 2*p);
  const d = v.map((x,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1)).join(' ');
  const col = color || 'var(--c1)';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="none" style="display:block;overflow:visible" aria-hidden="true">'
    + '<path d="' + d + ' L' + X(v.length-1).toFixed(1) + ' ' + H + ' L' + X(0).toFixed(1) + ' ' + H + ' Z" fill="' + col + '" opacity=".10"/>'
    + '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="' + X(v.length-1).toFixed(1) + '" cy="' + Y(v[v.length-1]).toFixed(1) + '" r="2.6" fill="' + col + '" stroke="var(--panel)" stroke-width="1.5"/></svg>';
}
function trendChart(vals, color, fmt){
  const W = 240, H = 74, px = 4, pt = 8, pb = 8;
  const v = vals.map(x => x == null ? 0 : x);
  const lo = Math.min(...v), hi = Math.max(...v), rg = (hi - lo) || 1;
  const X = i => px + i * (W - 2*px) / (v.length - 1);
  const Y = x => H - pb - ((x - lo) / rg) * (H - pt - pb);
  const d = v.map((x,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1)).join(' ');
  let hits = '';
  v.forEach((x,i) => {
    const w = (W - 2*px) / (v.length - 1);
    hits += '<rect x="' + (X(i)-w/2).toFixed(1) + '" y="0" width="' + w.toFixed(1) + '" height="' + H + '" fill="transparent"'
         +  ' onmousemove="tipShow(event,\'' + esc(t('week')) + ' ' + (i+1) + ' · ' + esc(fmt(vals[i])) + '\')" onmouseleave="tipHide()"></rect>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" style="display:block;overflow:visible">'
    + '<path d="' + d + ' L' + X(v.length-1).toFixed(1) + ' ' + H + ' L' + X(0).toFixed(1) + ' ' + H + ' Z" fill="' + color + '" opacity=".10"/>'
    + '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'

/* ==========================================================================
   THRESHOLDS — read off the real distribution of the 66 campuses
   attendance p10=39.9 p25=50.7 med=60.8 · exit-ticket correctness p10=48 med=62.5
   trust med=89 (only 39/66 campuses have any respondent) · never-attended p90=17.9
   ========================================================================== */
const TH = { att:45, etq:52, trust:78, neverPct:15, xc:50, xo:70 };

function issuesOf(row, kind){
  const out = [];
  const n = kind === 'campus' ? row.enr : row.n;
  if(row.att != null && row.att < TH.att)
    out.push({sev:(TH.att-row.att)/TH.att*2.2, k:'att', txt:(ar()?'الحضور ':'Attendance ') + pc1(row.att), act:'att'});
  if(row.etq != null && row.etq < TH.etq)
    out.push({sev:(TH.etq-row.etq)/TH.etq*1.6, k:'etq', txt:(ar()?'صحة تذاكر الخروج ':'Exit-ticket correctness ') + pc1(row.etq), act:'etq'});
  if(row.tn > 0 && row.tr != null && row.tr < TH.trust)
    out.push({sev:(TH.trust-row.tr)/TH.trust*1.4, k:'tr', txt:(ar()?'الثقة ':'Trust ') + pc1(row.tr) + ' (' + bd(row.tn) + (ar()?' مستجيب)':' responses)'), act:'tr'});
  if(kind === 'campus'){
    const nv = n ? 100*row.never/n : 0;
    if(nv > TH.neverPct)
      out.push({sev:nv/TH.neverPct*1.5, k:'never', txt:bd(row.never) + (ar()?' طالبًا لم يحضروا أبدًا (':' students never attended (') + pc1(nv) + ')', act:'never'});
    /* one ticket per exam the school is actually assigned — never a generic "the diagnostic" */
    EXM.forEach(e => {
      const x = xr(row.id, e.k);
      if(!(x.n > 0)) return;
      const w = winOf(e), base = {ex:e, n:x.n, o:x.o, c:x.c};
      if(x.o === 0)
        out.push(Object.assign(base, {sev:w.closed ? 2.0 : (w.left != null && w.left <= 1 ? 1.9 : 1.5), k:'nostart',
          txt:esc(exName(e)) + (ar() ? ' — لم يدخله أي من ' : ' — none of the ') + bd(num(x.n)) + (ar() ? ' مُعيَّنًا' : ' assigned students opened it'),
          act:'nostart'}));
      else if(w.closed && x.o < TH.xo)
        out.push(Object.assign(base, {sev:0.4 + (TH.xo - x.o)/TH.xo*1.6, k:'lowopen',
          txt:esc(exName(e)) + ' — ' + (ar() ? 'دخله ' : 'opened by ') + pc1(x.o) + (ar() ? ' فقط بعد إغلاقه' : ' only, window closed'),
          act:'lowopen'}));
      else if(x.o > 0 && x.c != null && x.c < TH.xc && (w.closed || x.o - x.c >= 25))
        out.push(Object.assign(base, {sev:(TH.xc - x.c)/TH.xc*1.3, k:'lowdone',
          txt:esc(exName(e)) + ' — ' + (ar() ? 'إكماله ' : 'completion ') + pc1(x.c),
          act:'lowdone'}));
    });
    if(row.tn === 0)
      out.push({sev:0.9, k:'survey', txt:t('noSurvey'), act:'survey'});
  }
  return out;
}

function studentsOf(pred){ return studentsInScope().filter(pred); }

/* ==========================================================================
   WHAT IS GOING RIGHT
   Cut-offs are the top decile of the real distribution, not round numbers:
   campus attendance p90=85.7 · exit correctness p90=73.3 · trust p90=95
   · per-exam completion ≥95% over ≥20 assigned students | facilitator attendance p90=74.3 · correctness p90=74.4
   A gain only counts when the baseline week actually ran sessions — otherwise a school
   that was dark last week shows a fake +77 point "improvement".
   ========================================================================== */
const TOP = {att:85, etq:73, qc:95, trust:95, fAtt:74, fEtq:74, fTrust:97, gain:5, minAct:20, minTn:5, minEx:20};

/* the weakest peer on the same metric, so a win comes with somewhere to send it */
function weakestOn(list, key, floor){
  const c = list.filter(x => x[key] != null && x[key] < floor).sort((a,b) => a[key] - b[key])[0];
  return c ? c.name + ' ' + pc(c[key]) : null;
}
function gainOf(mid){
  const c = weeklyFor(mid, CUR_WK), b = weeklyFor(mid, baseWk());
  if(!c || !b || c.att == null || b.att == null) return null;
  if((b.act || 0) < TOP.minAct) return null;        // baseline week was dark — not a real gain
  return c.att - b.att;
}

/* one win per exam whose ASSIGNED students nearly all finished it — never a blended "the diagnostic" */
function examWins(a, sev){
  const w = [];
  EXM.forEach(e => {
    if(a['n_' + e.k] >= TOP.minEx && a[e.c] != null && a[e.c] >= TOP.qc)
      w.push({k:'xc', ex:e, sev, txt:esc(exName(e)) + ' — ' + (ar() ? 'أكمله ' : 'completed by ') + pc1(a[e.c]) + (ar() ? ' من ' : ' of ') + bd(num(a['n_' + e.k])) + (ar() ? ' مُعيَّنًا' : ' assigned')});
  });
  return w;
}
function layerWins(kind){

      EXM.forEach(e => {
        const el = eligCampuses(cs, e.k);
        if(el.length >= 3 && el.every(c => xr(c.id, e.k).o >= 80)) w.push({k:'exam', ex:e, sev:1.6,
          txt:esc(exName(e)) + ' — ' + (ar() ? 'كل مدارسه الـ' : 'all ') + bd(el.length) + (ar() ? ' فتحه ٨٠٪ من مُعيَّنيها فأكثر' : ' schools opened it at 80%+ of assigned')});
      });
      examWins(a, 1.4).forEach(x => w.push(x));
      if(w.length) out.push({name:MNAME[mid], lvl:'mgr',
        sub:cs.length + ' ' + t('schools') + ' · ' + num(a.enr) + ' ' + t('students'),
        w, sev:w.reduce((x,i) => x + i.sev, 0)});
    });
  }

  if(kind === 'lead'){
    const inScope = new Set(list.map(c => c.id)), by = {};
    LD.filter(l => inScope.has(l.cid)).forEach(l => { (by[l.lid] = by[l.lid] || []).push(l.cid); });
    Object.entries(by).forEach(([lid, cids]) => {
      const cs = cids.map(id => CBY[id]).filter(Boolean);
      const a = agg(cs), w = [];
      const best = cs.slice().sort((x,y) => (y.att||0) - (x.att||0))[0];
      if(a.att != null && a.att >= TOP.att) w.push({k:'att', sev:2.0,
        txt:(ar()?'الحضور ':'Attendance ') + pc1(a.att) + (cs.length > 1 && best ? ' · ' + bd(esc(best.name)) : '')});
      examWins(a, 1.8).forEach(x => w.push(x));
      if(a.tn >= TOP.minTn && a.tr != null && a.tr >= TOP.trust) w.push({k:'trust', sev:1.6,
        txt:(ar()?'الثقة ':'Trust ') + pc1(a.tr) + ' (' + bd(a.tn) + ')'});

        sub:cs.slice(0,2).map(c => c.name).join('، ') + (cs.length > 2 ? ' +' + (cs.length-2) : '') + ' · ' + num(a.enr) + ' ' + t('students'),
        w, sev:w.reduce((x,i) => x + i.sev, 0)});
    });

    scopedFacs().forEach(f => {
      const w = [], school = (CBY[f.cid]||{}).name || '';

      if(f.att  != null && f.att  >= TOP.fAtt)  w.push({k:'att', sev:2.0, txt:(ar()?'الحضور ':'Attendance ') + pc1(f.att)});
      if(f.etqs != null && f.etqs >= TOP.fEtq)  w.push({k:'etq', sev:1.6, txt:(ar()?'صحة التذاكر لكل طالب ':'Per-student correctness ') + pc1(f.etqs)});
      if(f.tn >= TOP.minTn && f.tr != null && f.tr >= TOP.fTrust) w.push({k:'trust', sev:1.5,
        txt:(ar()?'الثقة ':'Trust ') + pc1(f.tr) + ' (' + bd(f.tn) + ')'});
      /* zero absence is only remarkable in a big class — 71 of 115 facilitators cleared
         the old n>=20 bar on this alone, which made the praise meaningless */
      if(f.n >= 40 && !mine.filter(r => r[S_X] & 1).length) w.push({k:'never', sev:0.8,
        txt:(ar()?'كل طلابه الـ':'all ') + bd(f.n) + (ar()?' حضروا':' of his students attended')});
      if(w.length) out.push({name:f.fname, lvl:'fac', sub:school + ' · ' + f.n + ' ' + t('students'),
        w, sev:w.reduce((x,i) => x + i.sev, 0)});
    });
  }
  return out.filter(x => x.sev >= 1.5).sort((a,b) => b.sev - a.sev);
}

/* praise is only useful if it says what to copy and where to send it */
const PRAISE = {
  mgr: {
    gain: () => [ 'أكبر قفزة حضور في الشبكة هذا الأسبوع — اسأله ما الذي تغيّر بالضبط وعمّمه على بقية المدراء.',
                  'The biggest attendance jump in the network this week — ask what changed and spread it to the other managers.' ],

    exam: w => [ 'كل مدارسه المُعيَّن لها ' + exName(w.ex) + ' فتحته بنسبة عالية — اطلب منه خطته للجدولة وشاركها مع بقية المدراء.',
                 'Every school of his that is assigned the ' + w.ex.en + ' exam opened it at a high rate — ask for his scheduling plan and share it with the other managers.' ],
    xc:   w => [ 'أكمل تقريبًا كل المُعيَّنين ' + exName(w.ex) + ' عبر المحفظة — وثّق كيف تابع المتخلّفين.',
                 'Nearly everyone assigned the ' + w.ex.en + ' exam finished it across the portfolio — document how he chased the stragglers.' ]
  },
  lead: {
    att:   w => [ 'أعلى حضور في نطاق المدير — اطلب منه يشرحه لقائد ' + (w.peer || 'المدرسة الأضعف') + '‏.',
                  'The highest attendance in the manager\'s scope — have him walk the lead of ' + (w.peer || 'the weakest school') + ' through it.' ],

                  'Nearly everyone assigned the ' + w.ex.en + ' exam completed it — ask how he arranged the sittings and copy it to schools stuck on this exam.' ],

                   'Student trust at the top with a solid response count — read their comments to see what makes the difference.' ],
    etq:   () => [ 'صحة تذاكر الخروج عالية — يعني الشرح يصل فعلًا، لا أن الطلاب يغلقون التذاكر فقط.',
                   'High exit-ticket correctness — the teaching is landing, not just the tickets being closed.' ],
    never: () => [ 'ولا طالب واحد بلا حضور في مدرسة بهذا الحجم — هذه نتيجة متابعة لا صدفة.',
                   'Not one absent student in a school this size — that is follow-up, not luck.' ]
  },
  fac: {
    att:   () => [ 'أعلى شريحة حضور بين المشرفين — اطلب منه يشارك أسلوبه مع زملائه في نفس المدرسة.',
                   'Top decile attendance among facilitators — have him share his approach with colleagues at the same school.' ],
    etq:   () => [ 'طلابه لا يغلقون التذاكر فحسب بل يجيبون صح — هذا مؤشر جودة شرح، اطلب نموذجًا من حصصه.',
                   'His students do not just close tickets, they answer correctly — that is teaching quality; ask for a sample lesson.' ],
    trust: () => [ 'ثقة طلابه شبه كاملة — اسأله كيف يبني هذه العلاقة، فهي أصعب ما يُنقل.',
                   'His students\' trust is near perfect — ask how he builds it; that is the hardest thing to transfer.' ],
    never: () => [ 'كل طلابه حضروا — لا غياب صفري بالصدفة في فصل بهذا الحجم.',
                   'Every one of his students attended — zero absence is not luck in a class this size.' ]
  }
};

function schoolWins(){
  return scopedCampuses().map(c => {
    const w = [];
    if(c.att  != null && c.att  >= TOP.att)   w.push({k:'att', sev:2.0, txt:(ar()?'الحضور ':'Attendance ') + pc1(c.att)});
    examWins(agg([c]), 1.8).forEach(x => w.push(x));
    if(c.tn >= TOP.minTn && c.tr != null && c.tr >= TOP.trust)
      w.push({k:'trust', sev:1.6, txt:(ar()?'الثقة ':'Trust ') + pc1(c.tr) + ' (' + bd(c.tn) + ')'});
    if(c.etq  != null && c.etq  >= TOP.etq)   w.push({k:'etq', sev:1.4, txt:(ar()?'صحة التذاكر ':'Ticket correctness ') + pc1(c.etq)});
    if(c.enr >= 50 && c.never === 0) w.push({k:'never', sev:1.5,
      txt:(ar()?'لا طالب واحد بلا حضور من ':'not one absent student out of ') + bd(num(c.enr))});
    if(!w.length) return null;
    const lds = leadsOfCampus(c.id).map(l => l.name);
    return {name:c.name, lvl:'lead', w, sev:w.reduce((x,i) => x + i.sev, 0),
      sub:(ar()?'قائد: ':'lead: ') + (lds.join('، ') || (ar()?'بلا قائد':'none')) + ' · ' + num(c.enr) + ' ' + t('students')};
  }).filter(x => x && x.sev >= 1.5).sort((a,b) => b.sev - a.sev);
}
function winRow(x){
  const lead = x.w.slice().sort((a,b) => b.sev - a.sev)[0];
  const fn = PRAISE[x.lvl][lead.k] || PRAISE[x.lvl].att;
  const txt = fn(lead)[ar() ? 0 : 1];
  return '<div class="srow win">'
    + '<div class="srow-top"><span style="font-size:16px">' + LAYER[x.lvl].ic + '</span>'
    + '<div><div class="srow-name">' + bd(esc(x.name)) + '</div><div class="srow-meta">' + bd(esc(x.sub)) + '</div></div>'
    + '<span class="pill p-green" style="margin-inline-start:auto">' + esc(ar() ? 'يستحق النقل' : 'Worth copying') + '</span></div>'
    + '<div class="srow-tags">' + x.w.map(i => '<span class="dtag good"><b>' + i.txt + '</b></span>').join('') + '</div>'
    + '<div class="srow-act"><b>' + esc(ar() ? 'ما تفعله به' : 'What to do with it') + ':</b> ' + esc(txt) + '</div></div>';
}

function schoolBlock(limit){
  const rows = rankedIssues(scopedCampuses()).filter(x => x.kind === 'campus');
  if(!rows.length) return '';
  const shown = limit ? rows.slice(0, limit) : rows;
  return '<div class="sectitle" style="margin-top:26px">🏫 ' + esc(ar() ? 'مدارس بحاجة إلى متابعة' : 'Schools needing follow-up')
      + ' <span style="font-size:12.5px;font-weight:600;color:var(--mut)">(' + bd(rows.length) + ')</span></div>'
    + '<div class="secsub">' + esc(t('bySchoolSub')) + '</div>'
    + shown.map(issueRow).join('')
    + (rows.length > shown.length ? '<div style="margin-bottom:6px"><button class="ghost" onclick="setTab(\'action\')">'
        + esc(ar() ? 'عرض الباقي' : 'See the rest') + ' (' + bd(rows.length - shown.length) + ') →</button></div>' : '');
}
function schoolWinsSection(limit){
  const rows = schoolWins();
  if(!rows.length) return '';
  const shown = limit ? rows.slice(0, limit) : rows;
  return '<div class="sectitle" style="margin-top:30px">🌟 ' + esc(ar() ? 'مدارس يستحق أداؤها النقل' : 'Schools worth copying')
      + ' <span style="font-size:12.5px;font-weight:600;color:var(--mut)">(' + bd(rows.length) + ')</span></div>'
    + '<div class="secsub">' + esc(ar()
        ? 'أعلى عشر بالمئة من التوزيع الفعلي، مع اسم قائد كل مدرسة لتعرف بمن تتصل.'
        : 'The top decile of the real distribution, with each school\'s lead so you know who to call.') + '</div>'
    + shown.map(winRow).join('');
}
/* the toggle picks the lens; both sides read the same tickets */
function followUpSection(limit){
  return state.viewBy === 'school' ? schoolBlock(limit)
       : (layerBlock('mgr', limit) + layerBlock('lead', limit && limit+1) + layerBlock('fac', limit && limit+1));
}
function celebrateSection(limit){
  return state.viewBy === 'school' ? schoolWinsSection(limit) : winsSection(limit);
}
function setViewBy(v){ state.viewBy = v; save(); render(); }

function winsSection(limit){
  const blocks = ['mgr','lead','fac'].map(k => {
    const rows = layerWins(k);
    if(!rows.length) return '';
    const shown = limit ? rows.slice(0, limit) : rows;
    return '<div class="sectitle" style="margin-top:22px;font-size:15px">' + LAYER[k].ic + ' '
        + esc(ar() ? LAYER[k].ar.replace('بحاجة إلى متابعة', 'يستحقون الإشادة')
                   : LAYER[k].en.replace('needing follow-up', 'worth celebrating'))
        + ' <span style="font-size:12px;font-weight:600;color:var(--mut)">(' + bd(rows.length) + ')</span></div>'
      + shown.map(winRow).join('');
  }).join('');
  if(!blocks) return '';
  return '<div class="sectitle" style="margin-top:30px">🌟 ' + esc(ar() ? 'ما يستحق النقل' : 'What is worth copying') + '</div>'
    + '<div class="secsub">' + esc(ar()
        ? 'أعلى عشر بالمئة من التوزيع الفعلي — لا أرقام مستديرة. وكل إشادة معها ما تفعله بها، لأن الثناء بلا نقل لا يغيّر شيئًا.'
        : 'The top decile of the real distribution, not round numbers. Each one says what to do with it — praise that is not transferred changes nothing.') + '</div>'
    + blocks;
}

/* names, not counts — a ticket you cannot act on is not a ticket */
function nameList(arr, max){
  max = max || 3;
  if(!arr || !arr.length) return '';
  const head = arr.slice(0, max).map(x => bd(esc(x))).join('، ');
  return head + (arr.length > max ? (ar() ? ' و' + bd(arr.length - max) + ' أخرى' : ' +' + bd(arr.length - max)) : '');
}
/* open a named list already narrowed to one school or class */
function openDrillQ(k, q){ state.drill = {k, q: q || '', n: 200, cid:null}; render(); }
/* schools where a student-level gap concentrates, worst first */
function topSchools(rows, max){
  const g = Object.entries(groupBy(rows, r => r[S_CID])).sort((a,b) => b[1].length - a[1].length);
  const one = g.length === 1;
  return g.slice(0, max || 3).map(([cid, rs]) =>
    ((CBY[cid]||{}).name || cid) + (one ? '' : ' (' + rs.length + ')'));
}

function layerRows(kind){
  const list = scopedCampuses();
  const out = [];

  if(kind === 'mgr'){
    const ids = state.manager === 'ALL' ? M.map(m => m.id) : [Number(state.manager)];
    ids.forEach(mid => {
      const cs = list.filter(c => mgrIds(c).includes(Number(mid)));
      if(!cs.length) return;
      const a = agg(cs), iss = [];
      const nolead = cs.filter(c => !leadsOfCampus(c.id).length);
      const silent = cs.filter(c => c.tn === 0);
      const orph   = ORPH.filter(o => cs.some(c => c.id === o.c));
      const never  = a.never;
      const nvRows = studentsOf(r => cs.some(c => c.id === r[S_CID]) && (r[S_X] & 1));
      const badAtt = cs.filter(c => c.att != null && c.att < TH.att).sort((x,y) => x.att - y.att);
      EXM.forEach(e => {
        const el = eligCampuses(cs, e.k), w = winOf(e);
        const zero = el.filter(c => xr(c.id, e.k).o === 0);
        if(zero.length) iss.push({k:'noexam', ex:e, sev:(w.closed ? 1.8 : 1.0)*Math.min(2, 0.6 + zero.length/3),
          names:zero.map(c => c.name), q:zero.length === 1 ? zero[0].name : '', drill:e.k,
          lbl:exName(e) + (ar() ? ': لم يفتحه أي طالب' : ': nobody opened it')});
        const ea = agg(el), rest = el.filter(c => xr(c.id, e.k).o > 0);
        if(w.closed && ea['n_' + e.k] >= 20 && ea[e.o] != null && ea[e.o] < TH.xo && rest.length){
          const worst = rest.slice().sort((x,y) => unopenedN(y, e.k) - unopenedN(x, e.k)).slice(0, 3);
          iss.push({k:'lowopen', ex:e, sev:0.4 + (TH.xo - ea[e.o])/TH.xo*1.6, drill:e.k,
            names:worst.map(c => c.name + ' (' + unopenedN(c, e.k) + ')'),
            pre:exName(e) + ' — ' + (ar() ? 'دخله ' : 'opened by ') + pc1(ea[e.o]) + (ar() ? ' من ' : ' of ') + num(ea['n_' + e.k]) + (ar() ? ' مُعيَّنًا، أكثر المتخلفين في' : ' assigned, most unopened at')});
        }
      });
      if(nolead.length) iss.push({k:'nolead', sev:2.2, names:nolead.map(c => c.name),
        lbl:(ar()?'بلا قائد':'no lead')});
      if(orph.length) iss.push({k:'orphan', sev:2.0,
        names:uniq(orph.map(o => o.fn + ' — ' + ((CBY[o.c]||{}).name || o.c))),
        lbl:(ar()?'مشرف ملفه محذوف':'deleted facilitator')});
      if(never > 0 && a.enr && 100*never/a.enr > 8) iss.push({k:'never', sev:1.8*Math.min(3,(100*never/a.enr)/8),
        names:topSchools(nvRows), pre:num(never) + (ar()?' لم يحضروا أبدًا، أكثرهم في':' never attended, mostly at'),
        drill:'never'});
      if(a.att != null && a.att < TH.att) iss.push({k:'att', sev:1.6,
        names:(badAtt.length ? badAtt.slice(0,3).map(c => c.name + ' ' + pc(c.att)) : cs.map(c => c.name)),
        pre:(ar()?'الحضور ':'Attendance ') + pc1(a.att) + (ar()?'، الأضعف في':', weakest at')});
      if(silent.length >= 2) iss.push({k:'survey', sev:1.0, names:silent.map(c => c.name),
        lbl:(ar()?'بلا استبيان ثقة':'no trust survey')});
      if(iss.length) out.push({name:MNAME[mid], id:mid,
        sub:cs.length + ' ' + t('schools') + ' · ' + num(a.enr) + ' ' + t('students'),
        iss, sev:iss.reduce((x,i) => x + i.sev, 0), lvl:'mgr'});
    });
  }

  if(kind === 'lead'){
    const inScope = new Set(list.map(c => c.id));
    const by = {};
    LD.filter(l => inScope.has(l.cid)).forEach(l => { (by[l.lid] = by[l.lid] || []).push(l.cid); });
    Object.entries(by).forEach(([lid, cids]) => {
      const cs = cids.map(id => CBY[id]).filter(Boolean);
      const a = agg(cs), iss = [];
      const silent = cs.filter(c => c.tn === 0);
      const nvRows  = studentsOf(r => cids.includes(r[S_CID]) && (r[S_X] & 1));
      const badAtt  = cs.filter(c => c.att != null && c.att < TH.att).sort((x,y) => x.att - y.att);
      const badEtq  = cs.filter(c => c.etq != null && c.etq < TH.etq).sort((x,y) => x.etq - y.etq);
      const only1   = cs.length === 1 ? cs[0].name : '';
      EXM.forEach(e => {
        const w = winOf(e), el = eligCampuses(cs, e.k);
        const zero = el.filter(c => xr(c.id, e.k).o === 0);
        if(zero.length) iss.push({k:'noexam', ex:e, sev:w.closed ? 2.4 : 1.4, names:zero.map(c => c.name),
          lbl:exName(e) + (ar() ? ': لم يفتحه أي طالب' : ': nobody opened it'), q:zero.length === 1 ? zero[0].name : '', drill:e.k});
        const live = new Set(el.filter(c => xr(c.id, e.k).o > 0).map(c => c.id));
        const msRows = studentsOf(r => live.has(r[S_CID]) && (r[S_X] & GAP[e.k].bit));
        if(msRows.length) iss.push({k:'missed', ex:e, sev:(w.closed ? 1.2 : 0.6)*Math.min(1.6, 0.6 + msRows.length/40),
          names:topSchools(msRows), pre:exName(e) + ' — ' + num(msRows.length) + (ar() ? ' لم يفتحوه في' : ' have not opened it at'),
          drill:e.k, q:only1});
      });
      if(a.never > 0 && a.enr && 100*a.never/a.enr > 8) iss.push({k:'never', sev:1.9*Math.min(3,(100*a.never/a.enr)/8),
        names:topSchools(nvRows), pre:num(a.never) + (ar()?' لم يحضروا أبدًا في':' never attended at'),
        drill:'never', q:only1});
      if(a.att != null && a.att < TH.att) iss.push({k:'att', sev:1.7,
        names:(badAtt.length ? badAtt.slice(0,2).map(c => c.name + ' ' + pc(c.att)) : [only1 + ' ' + pc(a.att)]),
        pre:(ar()?'حضور منخفض في':'Low attendance at')});
      if(a.etq != null && a.etq < TH.etq) iss.push({k:'etq', sev:1.4,
        names:(badEtq.length ? badEtq.slice(0,2).map(c => c.name + ' ' + pc(c.etq)) : [only1 + ' ' + pc(a.etq)]),
        pre:(ar()?'صحة تذاكر ضعيفة في':'Weak ticket correctness at')});
      if(silent.length) iss.push({k:'survey', sev:0.9, names:silent.map(c => c.name),
        lbl:(ar()?'بلا استبيان ثقة':'no trust survey')});
      if(iss.length) out.push({name:LNAME[lid], id:lid,
        sub:cs.slice(0,2).map(c => c.name).join('، ') + (cs.length > 2 ? ' +' + (cs.length-2) : '') + ' · ' + num(a.enr) + ' ' + t('students'),
        iss, sev:iss.reduce((x,i) => x + i.sev, 0), lvl:'lead'});
    });
  }

  if(kind === 'fac'){
    scopedFacs().forEach(f => {
      const iss = [];
      const mine = studentsOf(r => r[S_FID] === f.fid && r[S_CID] === f.cid);
      const never = mine.filter(r => r[S_X] & 1).length;
      const school = (CBY[f.cid]||{}).name || '';
      const cls = a2 => uniq(a2.map(r => CO[r[S_CO]])).slice(0,3);
      const nvRows = mine.filter(r => r[S_X] & 1);
      const clsAll = uniq(mine.map(r => CO[r[S_CO]])).slice(0,2);
      if(f.att != null && f.att < TH.att) iss.push({k:'att', sev:2.0,
        names:[school + (clsAll.length ? ' · ' + clsAll[0] : '')],
        pre:(ar()?'الحضور ':'Attendance ') + pc1(f.att) + (ar()?' في':' at')});
      if(f.etqs != null && f.etqs < TH.etq) iss.push({k:'etq', sev:1.5, names:[school],
        pre:(ar()?'صحة التذاكر لكل طالب ':'Per-student correctness ') + pc1(f.etqs) + (ar()?' في':' at')});
      if(never > 0) iss.push({k:'never', sev:1.4*Math.min(3,never/3),
        names:cls(nvRows).length ? cls(nvRows) : [school],
        pre:never + (ar()?' لم يحضروا أبدًا في':' never attended in'), drill:'never', q:f.fname});
      if(f.tn >= 3 && f.tr != null && f.tr < TH.trust) iss.push({k:'trust', sev:1.2, names:[school],
        pre:(ar()?'الثقة ':'Trust ') + pc1(f.tr) + (ar()?' في':' at')});
      EXM.forEach(e => {
        const msRows = mine.filter(r => r[S_X] & GAP[e.k].bit);
        if(!msRows.length) return;
        iss.push({k:'missed', ex:e, sev:(winOf(e).closed ? 0.9 : 0.5)*clamp(msRows.length/5, 0.4, 3),
          names:cls(msRows).length ? cls(msRows) : [school],
          pre:exName(e) + ' — ' + msRows.length + (ar() ? ' لم يفتحوه في' : ' have not opened it in'), drill:e.k, q:f.fname});
      });
      if(iss.length) out.push({name:f.fname, id:f.fid,
        sub:((CBY[f.cid]||{}).name || '') + ' · ' + f.n + ' ' + t('students'),
        iss, sev:iss.reduce((x,i) => x + i.sev, 0), lvl:'fac'});
    });
  }
  return out.sort((a,b) => b.sev - a.sev);
}

function issueTag(i){
  const names = nameList(i.names, 2);
  const body = i.pre ? (esc(i.pre) + ' ' + names)
             : (names + (i.lbl ? ' <span style="color:var(--mut)">— ' + esc(i.lbl) + '</span>' : ''));
  const dr = !!i.drill;
  const click = dr ? ' style="cursor:pointer" onclick="openDrillQ(\'' + i.drill + '\',\''
        + esc(String(i.q || '')).replace(/'/g, "\\'") + '\')"' : '';
  return '<span class="dtag' + (i.sev < 1.5 ? ' warn' : '') + '"' + click + '><b>' + body + '</b>'
    + (dr ? ' <span style="color:var(--brick-t)">↗</span>' : '') + '</span>';
}
function layerRow(x){
  const tier = tierOf(x.sev);
  const tl = {urgent:[ar()?'عاجل':'Urgent','p-red'], high:[ar()?'مرتفع':'High','p-amber'], watch:[ar()?'للمتابعة':'Watch','p-blue']}[tier];
  const top3 = x.iss.slice().sort((a,b) => b.sev - a.sev).slice(0, 3);
  const fixes = top3.map(i => { const fn = FIX[x.lvl][i.k] || FIX[x.lvl].att; return typeof fn === 'function' ? fn(i) : ''; }).filter(Boolean);
  return '<div class="srow ' + tier + '">'
    + '<div class="srow-top"><span style="font-size:16px">' + LAYER[x.lvl].ic + '</span>'
    + '<div><div class="srow-name">' + bd(esc(x.name)) + '</div><div class="srow-meta">' + bd(esc(x.sub)) + '</div></div>'
    + '<span class="pill ' + tl[1] + '" style="margin-inline-start:auto">' + esc(tl[0]) + '</span></div>'
    + '<div class="srow-tags">' + x.iss.map(issueTag).join('') + '</div>'
    + fixes.map(f => '<div class="srow-act"><b>' + esc(t('action')) + ':</b> ' + f + '</div>').join('') + '</div>';
}

function layerBlock(kind, limit){
  const rows = layerRows(kind), L = LAYER[kind];
  if(!rows.length) return '';
  const shown = limit ? rows.slice(0, limit) : rows;
  return '<div class="sectitle" style="margin-top:26px">' + L.ic + ' ' + esc(ar() ? L.ar : L.en)
      + ' <span style="font-size:12.5px;font-weight:600;color:var(--mut)">(' + bd(rows.length) + ')</span></div>'
    + '<div class="secsub">' + esc(ar() ? L.sar : L.sen) + '</div>'
    + shown.map(layerRow).join('')
    + (rows.length > shown.length ? '<div style="margin-bottom:6px"><button class="ghost" onclick="setTab(\'action\')">'
        + esc(ar() ? 'عرض الباقي' : 'See the rest') + ' (' + bd(rows.length - shown.length) + ') →</button></div>' : '');
}

                     : '<b>Exams — six of them, each counted on its own:</b> ' + EXM.map(e => esc(e.en) + ' (' + e.nq + ' q)').join(', ') + '. Not every student sits every exam.') + '</li>'
    + '<li>' + (ar() ? '<b>من المُعيَّن له الاختبار؟</b> الطالب مُعيَّن له اختبار إذا جُدول الاختبار على فصله، أو كان مسجَّلًا في برنامجه (قدرات، ESL، تحصيلي، نافس)، أو أجرى الاختبار فعلًا. لذلك لا تُحسب مدارس المرحلة المتوسطة متخلفة عن قدرات أو ESL أو تحصيلي — لا تُعيَّن لها أصلًا.'
                     : '<b>Who is assigned an exam?</b> A student is assigned an exam when it is scheduled on their class, or they are enrolled in its programme (Qudrat, ESL, Tahsili, NAFES), or they have already sat it. So middle schools are never counted as behind on Qudrat, ESL or Tahsili — those are simply not assigned to them.') + '</li>'
    + '<li>' + (ar() ? '<b>الصف الدراسي:</b> يُقسَّم المُعيَّنون لكل اختبار على صفوفهم (اولى ثانوي، ثاني ثانوي، ثالث ثانوي، ثالث متوسط) من سجل الطالب في مدرسته؛ ومجموع الصفوف يساوي دائمًا عدد المُعيَّنين.'

                     : '<b>Rates:</b> opened = entered the exam, completed = answered 90%+ of the questions — both ÷ the students assigned that one exam, never the whole roster. The average is of completers only. A "—" cell means the exam is not assigned to that school.') + '</li>'
    + '<li>' + (ar() ? '<b>النوافذ:</b> ' : '<b>Windows:</b> ') + EXM.map(e => { const w = EXW[e.k]; return w ? esc(exShort(e)) + ' ' + bd(dfmt(w.from) + ' → ' + dfmt(w.to)) : ''; }).filter(Boolean).join(ar() ? '، ' : ', ')
      + (ar() ? '. النافذة المغلقة تعني أن من لم يدخل فاته الاختبار فعلًا؛ المفتوحة تعني أن الوقت ما زال متاحًا.' : '. A closed window means whoever has not opened it has genuinely missed it; an open one means there is still time.') + '</li>'
    + '<li>' + (ar() ? '<b>الأسابيع:</b> ' : '<b>Weeks:</b> ') + wk + (ar() ? '. الأسبوع الأول أسبوع تهيئة بلا حصص تقريبًا.' : '. Week 1 is orientation with almost no sessions.') + '</li>'
    + '<li>' + (ar() ? '<b>حدّ معروف:</b> السلسلة الأسبوعية مخزّنة على مستوى المدير، لذلك تختفي فروق الأسبوع عند الفلترة بمدرسة أو مشرف.'
                     : '<b>Known limit:</b> the weekly series is stored at manager grain, so week-over-week deltas disappear once you filter to a school or facilitator.') + '</li>'
    + '</ul></details>';
}

function execSummary(list){
  const a = agg(list), L = [];
  const cur = weeklyFor(state.manager, CUR_WK), base = weeklyFor(state.manager, baseWk());

  if(deltasLive() && cur && base && cur.att != null && base.att != null){
    const d = cur.att - base.att;
    L.push({cls: d < -0.5 ? 'warn' : d > 0.5 ? 'good' : 'info', ic: d < -0.5 ? '🔻' : d > 0.5 ? '🔺' : '▪️',
      html: ar()
        ? 'الحضور في الأسبوع ' + bd(CUR_WK) + ' <b>' + bd(pc1(cur.att)) + '</b>، بحركة <b>' + bd((d>=0?'+':'−') + Math.abs(d).toFixed(1) + ' نقطة') + '</b> مقابل الأسبوع 2‏.'
        : 'Week ' + bd(CUR_WK) + ' attendance is <b>' + bd(pc1(cur.att)) + '</b>, moving <b>' + bd((d>=0?'+':'−') + Math.abs(d).toFixed(1) + ' pts') + '</b> against week 2.'});
  }

  const nvPct = a.enr ? 100*a.never/a.enr : 0;
  if(a.never > 0){
    L.push({cls: nvPct > 10 ? 'warn' : 'info', ic:'🚫', html: ar()
      ? '<b>' + bd(num(a.never)) + ' طالبًا</b> من أصل ' + bd(num(a.enr)) + ' لم يحضروا ولا حصة واحدة (' + bd(pc1(nvPct)) + ')، أكثرهم في '
        + nameList(topSchools(studentsInScope().filter(r => r[S_X] & 1), 3), 3) + '‏. '
        + '<span class="lnk" onclick="openDrill(\'never\')">عرض أسماءهم ↗</span>'
      : '<b>' + bd(num(a.never)) + ' students</b> of ' + bd(num(a.enr)) + ' have not attended a single session (' + bd(pc1(nvPct)) + '), mostly at '
        + nameList(topSchools(studentsInScope().filter(r => r[S_X] & 1), 3), 3) + '. '
        + '<span class="lnk" onclick="openDrill(\'never\')">See their names ↗</span>'});
  }

  /* one line per exam, each over its OWN assigned students — never a blended "the diagnostic" */
  EXM.forEach(e => {
    const nE = a['n_' + e.k];
    if(!(nE > 0)) return;
    const el = eligCampuses(list, e.k), w = winOf(e), o = a[e.o], c = a[e.c];
    const un = el.reduce((s2, cc) => s2 + unopenedN(cc, e.k), 0);
    const worst = el.filter(cc => unopenedN(cc, e.k) > 0).sort((x,y) => unopenedN(y, e.k) - unopenedN(x, e.k)).slice(0, 3);
    const zero = el.filter(cc => xr(cc.id, e.k).o === 0);
    const quit = el.map(cc => ({name:cc.name, g:(xr(cc.id, e.k).o || 0) - (xr(cc.id, e.k).c || 0), n:xr(cc.id, e.k).n}))
                   .filter(r2 => r2.g >= 15 && r2.n >= 10).sort((x,y) => y.g - x.g);
    const soon = !w.closed && w.left != null && w.left <= 1;
    const cls = w.closed ? (o < 85 ? 'warn' : 'good') : ((soon ? o < 85 : o < 60) ? 'warn' : (o >= 85 ? 'good' : 'info'));
    const nmW = worst.map(cc => bd(esc(cc.name)) + ' (' + bd(num(unopenedN(cc, e.k))) + ')').join(ar() ? '، ' : ', ');
    const nmZ = zero.slice(0, 3).map(cc => bd(esc(cc.name))).join(ar() ? '، ' : ', ') + (zero.length > 3 ? (ar() ? ' و' + bd(zero.length - 3) + ' أخرى' : ' +' + bd(zero.length - 3)) : '');
    const nmQ = quit.slice(0, 3).map(r2 => bd(esc(r2.name)) + ' (' + bd(Math.round(r2.g)) + (ar() ? ' نقطة' : ' pt') + ')').join(ar() ? '، ' : ', ');
    L.push({cls, ic:e.ic, html: ar()
      ? '<b>' + esc(exName(e)) + '</b> — مُعيَّن لـ' + bd(num(nE)) + ' طالبًا في ' + schAr(el.length) + ': دخله <b>' + bd(pc1(o)) + '</b> وأكمله <b>' + bd(pc1(c)) + '</b> — ' + esc(winText(e)) + '. '
        + (un > 0 ? 'لم يدخله <b>' + bd(num(un)) + '</b> طالبًا، أكثرهم في ' + nmW + '. ' : 'دخله الجميع. ')
        + (zero.length ? 'لم يفتحه أحد في ' + nmZ + '. ' : '')
        + (quit.length ? 'يتركه طلاب بعد الدخول في ' + nmQ + '. ' : '')
        + (un > 0 ? '<span class="lnk" onclick="openDrill(\'' + e.k + '\')">أسماء من لم يدخلوه ↗</span>' : '')
      : '<b>' + esc(exName(e)) + '</b> — assigned to ' + bd(num(nE)) + ' students in ' + bd(el.length) + ' schools: <b>' + bd(pc1(o)) + '</b> opened and <b>' + bd(pc1(c)) + '</b> completed — ' + esc(winText(e)) + '. '
        + (un > 0 ? '<b>' + bd(num(un)) + '</b> have not opened it, mostly at ' + nmW + '. ' : 'Everyone opened it. ')
        + (zero.length ? 'Nobody opened it at ' + nmZ + '. ' : '')
        + (quit.length ? 'Students drop out after opening at ' + nmQ + '. ' : '')
        + (un > 0 ? '<span class="lnk" onclick="openDrill(\'' + e.k + '\')">Names of who has not opened it ↗</span>' : '')});
  });
  const noAssign = list.filter(cc => EXM.every(e => xr(cc.id, e.k).n === 0));
  if(noAssign.length){
    L.push({cls:'info', ic:'ℹ️', html: ar()
      ? '<b>' + schAr(noAssign.length, 1) + '</b> لا يوجد لها أي من الاختبارات الستة مُعيَّنًا: ' + noAssign.slice(0, 5).map(cc => bd(esc(cc.name))).join('، ') + (noAssign.length > 5 ? ' وغيرها' : '')
        + '‏. هذا تصميم لا تقصير — تأكد فقط أنه مقصود.'
      : '<b>' + bd(noAssign.length) + ' schools</b> have none of the six exams assigned: ' + noAssign.slice(0, 5).map(cc => bd(esc(cc.name))).join(', ') + (noAssign.length > 5 ? ' and others' : '')
        + '. That is by design rather than a lapse — just confirm it is intended.'});
  }

  const noSurvey = list.filter(c => c.tn === 0).sort((a,b) => b.enr - a.enr);
  if(noSurvey.length){
    const nm = noSurvey.slice(0,4).map(c => bd(esc(c.name)) + ' (' + bd(num(c.enr)) + ')').join('، ')
             + (noSurvey.length > 4 ? (ar() ? ' و' + bd(noSurvey.length-4) + ' أخرى' : ' +' + bd(noSurvey.length-4)) : '');
    L.push({cls:'info', ic:'🤝', html: ar()
      ? 'استبيان الثقة بلا أي استجابة في <b>' + bd(noSurvey.length) + '</b> من ' + bd(list.length) + ' مدرسة: ' + nm + '‏.'
      : 'The trust survey has no responses at all in <b>' + bd(noSurvey.length) + '</b> of ' + bd(list.length) + ' schools: ' + nm + '.'});
  }

  /* structural gaps — an owner is missing, so no metric will ever flag them */
  const nolead = list.filter(c => !leadsOfCampus(c.id).length);
  if(nolead.length) L.push({cls:'warn', ic:'🎖️', html: ar()
    ? '<b>' + bd(nolead.length) + ' مدرسة بلا قائد مُعيَّن</b> (' + bd(num(nolead.reduce((a,c) => a + c.enr, 0))) + ' طالبًا): '
      + nolead.map(c => bd(esc(c.name))).join('، ') + '. لا أحد يملك تشغيلها اليوم‏.'
    : '<b>' + bd(nolead.length) + ' schools have no assigned lead</b> (' + bd(num(nolead.reduce((a,c) => a + c.enr, 0))) + ' students): '
      + nolead.map(c => bd(esc(c.name))).join(', ') + '. Nobody owns running them today.'});

  const orphAll = ORPH.filter(o => list.some(c => c.id === o.c));
  const orph = orphAll.filter(o => (o.w || 'D') === 'D');
  if(orph.length){
    const byFac = groupBy(orph, o => o.f);
    L.push({cls:'warn', ic:'⛓️', html: ar()
      ? '<b>' + bd(orph.length) + ' فصلًا مُسندًا إلى مشرف ملفه محذوف</b> (' + bd(num(orph.reduce((a,o) => a + o.n, 0))) + ' طالبًا) — '
        + Object.values(byFac).map(g => bd(esc(g[0].fn)) + ' في ' + bd(esc((CBY[g[0].c]||{}).name || g[0].c)) + ' (' + bd(g.length) + ')').join('، ')
        + '. الطلاب بلا مسؤول فعلي‏.'
      : '<b>' + bd(orph.length) + ' classes are assigned to a deleted facilitator profile</b> (' + bd(num(orph.reduce((a,o) => a + o.n, 0))) + ' students) — '
        + Object.values(byFac).map(g => bd(esc(g[0].fn)) + ' at ' + bd(esc((CBY[g[0].c]||{}).name || g[0].c)) + ' (' + bd(g.length) + ')').join(', ')
        + '. These students have no real owner.'});
  }
  /* A cohort pointed at an internal placeholder account. It is NOT a person's workload —
     naming them as a facilitator would blame someone who never taught there. */
  const plac = orphAll.filter(o => o.w === 'I');
  if(plac.length){
    const stu = plac.reduce((a,o) => a + o.n, 0);
    const kk  = [...new Set(plac.map(o => o.k))];
    const sch = plac.slice().sort((a,b) => b.n - a.n).slice(0,4)
                 .map(o => bd(esc((CBY[o.c]||{}).name || o.c)) + ' (' + bd(o.n) + ')');
    L.push({cls:'warn', ic:'🏷️', html: ar()
      ? '<b>' + bd(num(stu)) + ' طالبًا في ' + bd(plac.length) + ' فصلًا بلا مشرف حقيقي</b> — الفصل '
        + kk.map(k => bd(esc(k))).join('، ') + ' مرتبط بحساب داخلي لا بشخص، ويمتد عبر '
        + bd(new Set(plac.map(o => o.c)).size) + ' مدرسة: ' + sch.join('، ')
        + (plac.length > 4 ? ' وغيرها' : '') + '‏. استُبعد الحساب من قائمة المشرفين عمدًا حتى لا تُنسب أرقام هذه المدارس إلى شخص لا يعمل فيها — عيّن مشرفًا حقيقيًا لهذا الفصل‏.'
      : '<b>' + bd(num(stu)) + ' students in ' + bd(plac.length) + ' classes have no real facilitator</b> — cohort '
        + kk.map(k => bd(esc(k))).join(', ') + ' points at an internal account rather than a person, and spans '
        + bd(new Set(plac.map(o => o.c)).size) + ' schools: ' + sch.join(', ')
        + (plac.length > 4 ? ' and others' : '')
        + '. The account is deliberately kept out of the facilitator list so these schools\' numbers are never attributed to someone who does not work there — assign a real facilitator to this cohort.'});
  }

  const worst = list.filter(c => c.att != null).sort((x,y) => x.att - y.att)[0];
  if(worst){
    L.push({cls:'info', ic:'🏫', html: ar()
      ? 'أدنى حضور: <b>' + bd(esc(worst.name)) + '</b> عند ' + bd(pc1(worst.att)) + ' لـ' + bd(num(worst.enr)) + ' طالبًا‏.'
      : 'Lowest attendance: <b>' + bd(esc(worst.name)) + '</b> at ' + bd(pc1(worst.att)) + ' across ' + bd(num(worst.enr)) + ' students.'});
  }
  return '<div class="execwrap">' + L.map(x => '<div class="execline ' + x.cls + '"><span class="ic">' + x.ic + '</span><span>' + x.html + '</span></div>').join('') + '</div>';
}

/* which KPI tiles open a student list */
const KPI_DRILL = {never:'never', qs:'q'};
EXM.forEach(e => { KPI_DRILL[e.o] = e.k; });
const KPI_CM = 'tr';   /* trust card opens the comments instead of a student list */
function kpiCard(k, a, hero){
  const m = MET[k], v = a[k];
  const dk = KPI_DRILL[k], n = dk ? gapCount(dk) : 0;
  const cur = weeklyFor(state.manager, CUR_WK), base = weeklyFor(state.manager, baseWk());
  let dl = '';
  if(m.wkKey && cur && base) dl = deltaChip(k, cur[m.wkKey], base[m.wkKey]);
  let sp = '';
  if(m.wkKey && deltasLive()){
    const s = WEEKS.map(w => { const x = weeklyFor(state.manager, w); return x ? x[m.wkKey] : null; });
    sp = '<div class="spark">' + spark(s) + '</div>';
  }
  let note = '';
  if(k === 'enr')  note = '<div class="note2">' + bd(num(a.act)) + ' ' + esc(t('active')) + ' · ' + bd(num(a.never)) + ' ' + esc(t('never')) + '</div>';
  if(k === 'tr')   note = '<div class="note2">' + bd(num(a.tn)) + ' ' + (ar() ? 'مستجيب' : 'responses') + '</div>';
  if(k === 'qs')   note = '<div class="note2">' + (a.n_q > 0
      ? (ar() ? 'أكمله ' : 'completed by ') + bd(pc(a.qc)) + (ar() ? ' من ' : ' of ') + bd(num(a.n_q)) + (ar() ? ' مُعيَّنًا في ' : ' assigned in ') + (ar() ? schAr(a.sch_q) : bd(a.sch_q) + ' schools')
      : (ar() ? 'قدرات غير مُعيَّن في هذا النطاق' : 'Qudrat is not assigned in this scope')) + '</div>';
  if(m.ex) note = '<div class="note2">' + (a['n_' + m.ex.k] > 0
      ? (ar() ? 'من ' : 'of ') + bd(num(a['n_' + m.ex.k])) + (ar() ? ' مُعيَّنًا في ' : ' assigned in ') + (ar() ? schAr(a['sch_' + m.ex.k]) + ' · ' : bd(a['sch_' + m.ex.k]) + ' schools · ') + esc(winText(m.ex))
      : (ar() ? 'غير مُعيَّن في هذا النطاق' : 'Not assigned in this scope')) + '</div>';
  if(k === 'att')  note = '<div class="note2">' + (ar() ? 'من حصص مقرراتهم الفعلية · متوسط الفترة' : 'of their real timetable · window average') + '</div>';
  if(k === 'etq')  note = '<div class="note2">' + (ar() ? 'الإغلاق ' : 'closure ') + bd(pc(a.etc))
                        + ' · ' + (ar() ? 'لكل طالب مغلِق ' : 'per closer ') + '<b style="color:var(--txt)">' + bd(pc(a.etqs)) + '</b>'
                        + ' (' + bd(num(a.etn)) + ')</div>';
  if(k === 'etqs') note = '<div class="note2">' + bd(num(a.etn)) + ' ' + (ar() ? 'طالبًا أغلقوا تذكرة واحدة على الأقل' : 'students closed at least one ticket') + '</div>';
  const nCm = k === KPI_CM ? commentsInScope().length : 0;
  if(k === KPI_CM && nCm > 0){
    return '<div class="kpi' + (hero ? ' hero' : '') + ' clk" onclick="openComments()">'
      + '<div class="lbl"><span>' + m.ic + '</span>' + esc(t(m.lbl)) + '</div>'
      + '<div class="val">' + bd(m.fmt(v)) + '</div>' + note + dl + sp
      + '<div class="drill">▸ ' + bd(num(nCm)) + ' ' + esc(ar() ? 'تعليقًا' : 'comments') + ' · '
      + esc(t('openComments')) + ' ↗</div></div>';
  }

function managerTable(){
  const rows = M.map(m => {
    const list = managerCampuses(m.id).filter(typeOk);
    const a = agg(list);
    /* the weekly series is manager-grain, so it cannot be split by campus type —
       show no delta rather than one that silently covers the whole portfolio */
    const c3 = deltasLive() ? weeklyFor(m.id, CUR_WK) : null;
    const c2 = deltasLive() ? weeklyFor(m.id, baseWk()) : null;
    return {name:m.name, id:m.id, a, n:list.length,
            d:(c3 && c2 && c3.att != null && c2.att != null) ? c3.att - c2.att : null};
  }).filter(r => r.a.enr > 0).sort((x,y) => y.a.enr - x.a.enr);
  const cols = [['enr',num],['act',num],['never',num],['att',pc1],['etq',pc1],['tr',pc1]].concat(EXM.map(e => [e.o, pc]));
  const head = '<tr><th>' + esc(t('rank')) + '</th><th>' + esc(t('manager')) + '</th>'
    + cols.map(c => '<th class="num">' + esc(t(MET[c[0]] ? MET[c[0]].lbl : c[0]) || c[0]) + '</th>').join('')
    + '<th class="num">' + (ar()?'حركة الحضور':'Attendance Δ') + '</th></tr>';
  const body = rows.map((r,i) => '<tr>'
    + '<td class="rankcell">' + (i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)) + '</td>'
    + '<td class="namecell">' + bd(esc(r.name)) + '<small>' + bd(r.n) + ' ' + esc(t('schools')) + '</small></td>'
    + cols.map(c => '<td class="num">' + bd(c[1](r.a[c[0]])) + '</td>').join('')
    + '<td class="num">' + (r.d == null ? '—' : '<span style="font-weight:700;color:' + (r.d>=0?'var(--green-t)':'var(--red-t)') + '">'
        + (r.d>=0?'▲ +':'▼ −') + bd(Math.abs(r.d).toFixed(1)) + '</span>') + '</td></tr>').join('');
  return '<div class="card"><div class="tscroll"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>';
}

function moversCard(){
  /* cross-manager ranking. With one manager selected it is both irrelevant to them
     and a leak of their peers' numbers, so it only exists at network scope. */
  if(state.manager !== 'ALL') return '';
  if(!deltasLive()) return '<div class="note" style="border-inline-start-color:var(--blue)">'
    + (ar() ? 'حركة الأسبوع مخزّنة على مستوى المدير فقط، فلا يمكن عرضها مع فلتر النوع أو المدرسة أو المشرف. أزل الفلتر لرؤيتها.'
            : 'The week-over-week series is stored at manager grain, so it cannot be shown alongside a type, school or facilitator filter. Clear the filter to see it.')
    + '</div>';
  const rows = M.map(m => {
    const c3 = weeklyFor(m.id, CUR_WK), c2 = weeklyFor(m.id, baseWk());
    if(!c3 || !c2 || c3.att == null || c2.att == null) return null;
    return {name:m.name, sub:managerCampuses(m.id).length + ' ' + t('schools'), d:c3.att - c2.att, cur:c3.att};
  }).filter(Boolean).sort((a,b) => b.d - a.d);
  if(rows.length < 2) return '';
  const row = x => '<div class="moverow"><div><div class="nm">' + bd(esc(x.name)) + '</div><div class="sc">' + bd(esc(x.sub)) + ' · ' + bd(pc1(x.cur)) + '</div></div>'
    + '<span class="vv" style="color:' + (x.d>=0?'var(--green-t)':'var(--red-t)') + '">' + (x.d>=0?'▲ +':'▼ −') + bd(Math.abs(x.d).toFixed(1)) + '</span></div>';
  const down = rows.slice(-4).reverse(), anyDown = down.some(x => x.d < 0);
  return '<div class="sectitle" style="margin-top:26px">' + (ar() ? 'أكبر التحركات — الحضور، الأسبوع ' + CUR_WK + ' مقابل ' + baseWk() : 'Biggest movers — attendance, week ' + CUR_WK + ' vs ' + baseWk()) + '</div>'
    + '<div class="secsub">' + (ar() ? 'على مستوى المدير، لأن السلسلة الأسبوعية متاحة بهذا التفصيل فقط.' : 'At manager grain, because that is the only grain the weekly series is stored at.') + '</div>'
    + '<div class="grid2">'
    + '<div class="card"><h3>🔺 ' + (ar()?'أكبر تحسّن':'Biggest improvement') + '</h3>' + rows.slice(0,4).map(row).join('') + '</div>'
    + '<div class="card"><h3>' + (anyDown?'🔻 ':'▪️ ') + (anyDown ? (ar()?'أكبر تراجع':'Biggest decline') : (ar()?'الأقل تحسّنًا':'Least improvement')) + '</h3>' + down.map(row).join('') + '</div>'
    + '</div>';
}

/* ---------- schools ---------- */
const CCOLS = [
  ['enr',  num,  'enrolled'], ['act', num, 'active'], ['never', num, 'never'],

/* an exam column reads "—" unless the exam is assigned to that school */
function campusRow(c){
  const r = Object.assign({}, c);
  EXM.forEach(e => {
    const x = xr(c.id, e.k);
    r['n_' + e.k] = x.n;
    r[e.o] = x.n ? x.o : null; r[e.c] = x.n ? x.c : null; r[e.s] = x.n ? x.s : null;

}
const EXOCOL = Object.fromEntries(EXM.map(e => [e.o, e.k]));
function sortC(k){ const s = state.sortC; s.d = s.k === k ? -s.d : -1; s.k = k; render(); }
function sortF(k){ const s = state.sortF; s.d = s.k === k ? -s.d : -1; s.k = k; render(); }

        : 'Red: an exam is assigned to the school and no student opened it, or more than 15% of students never attended. "—" = exam not assigned to this school. Exam rates are over assigned students only.') + '</span></div></div>';

function trendSection(){
  if(!deltasLive()) return '';
  const mets = [['att','att','var(--c1)'],['etq','etq','var(--c2)'],['tr','trust','var(--c5)']];
  const ids = state.manager === 'ALL' ? M.map(m => m.id) : [Number(state.manager)];
  const cols = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
  const mk = state.trendMetric;
  const facets = ids.map((id,i) => {
    const s = WEEKS.map(w => { const x = weeklyFor(id, w); return x ? x[mk] : null; });
    if(s.every(x => x == null)) return '';
    const d = (s[2] != null && s[1] != null) ? s[2] - s[1] : null;
    return '<div class="facet"><div class="fh"><span class="fn">' + bd(esc(MNAME[id] || id)) + '</span>'
      + (d == null ? '' : '<span class="fd" style="color:' + (d>=0?'var(--green-t)':'var(--red-t)') + '">' + (d>=0?'▲ +':'▼ −') + bd(Math.abs(d).toFixed(1)) + '</span>')
      + '</div><div class="fv" style="color:' + cols[i%5] + '">' + bd(pc1(s[2])) + '</div>'
      + trendChart(s, cols[i%5], pc1)
      + '<div dir="ltr" style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:2px">'
      + '<span>' + bd(t('week') + ' ' + FST_WK) + '</span><span>' + bd(t('week') + ' ' + CUR_WK) + '</span></div></div>';
  }).join('');
  return '<div class="sectitle" style="margin-top:26px">' + esc(t('trendTitle')) + '</div>'
    + '<div class="secsub">' + esc(t('trendSub')) + '</div>'
    + '<div class="chips">' + mets.map(m => '<button class="chip ' + (mk === m[0] ? 'on' : '') + '" onclick="setTrend(\'' + m[0] + '\')">' + esc(t(m[1])) + '</button>').join('') + '</div>'
    + '<div class="card"><div class="facets">' + facets + '</div></div>';
}

    + '<span class="ev">' + bd(pc(v)) + '</span></div>';

function winPill(e){
  const w = winOf(e);
  const cls = w.closed ? 'p-red' : (w.left != null && w.left <= 1 ? 'p-amber' : 'p-green');
  return '<span class="pill ' + cls + '">' + esc(winText(e)) + '</span>';

  let n = 0, o = 0, c = 0;
  eligCampuses(list, k).forEach(x => { const r = xr(x.id, k); n += r.n; o += Math.round(r.n * (r.o||0) / 100); c += Math.round(r.n * (r.c||0) / 100); });
  return {n, o, c};
}

        : 'sorted by most students who have not opened it. Red under Opened = nobody opened it; red under Completed = opened and abandoned.') + '</span></div></div>';
  });

  /* schools with no exam assigned: not a gap, just not in scope of any diagnostic */
  const bare = list.filter(c => !EXM.some(e => xr(c.id, e.k).n > 0));
  if(bare.length) h += '<div class="card" style="margin-top:26px;font-size:12.5px;line-height:1.8">'

    + bare.map(c => bd(esc(c.name))).join(A ? '، ' : ', ') + '.</div>';
  h += simSection();
  return h;
}

const SIM_P  = [['all','كل الفترة (منذ أغسطس 2025)','Everything since Aug 2025'], ['y2526','العام 2025/26','2025/26'], ['y2627','العام 2026/27','2026/27']];
const SIM_PR = [['القدرات','Qudrat'], ['التحصيلي','Tahsili'], ['نافس','NAFES'], ['ESL','ESL'], ['المنهج الوطني','National curriculum'], ['الدولي','International']];
const SIM_G  = ['سادس ابتدائي','اول متوسط','ثاني متوسط','ثالث متوسط','Grade 9','Grade 10','اولى ثانوي','ثاني ثانوي','ثالث ثانوي','Graduated - Middle School','Graduated','بدون صف'];
const SIM_G_EN = {'سادس ابتدائي':'6th primary','اول متوسط':'1st intermediate','ثاني متوسط':'2nd intermediate','ثالث متوسط':'3rd intermediate',
  'اولى ثانوي':'1st secondary','ثاني ثانوي':'2nd secondary','ثالث ثانوي':'3rd secondary','Graduated':'Graduated','Graduated - Middle School':'Graduated (middle school)','بدون صف':'No grade'};
const SIM_G_AR = {'Graduated':'خريج','Graduated - Middle School':'خريج (متوسط)','Grade 9':'Grade 9','Grade 10':'Grade 10'};
const simGrade = g => ar() ? (SIM_G_AR[g] || g) : (SIM_G_EN[g] || g);
const simRank = g => { const i = SIM_G.indexOf(g); return i < 0 ? 50 : i; };
function setSim(k, v){ state[k] = v; save(); render(); }
function simSection(){
  const A = ar();
  const chips = (key, opts) => '<div class="chips">' + opts.map(o => '<button class="chip ' + (state[key] === o[0] ? 'on' : '') + '" onclick="setSim(\'' + key + '\',\'' + o[0] + '\')">' + esc(A ? o[1] : o[2]) + '</button>').join('') + '</div>';
  const prs = [['ALL','كل البرامج','All programmes']].concat(SIM_PR.map(p => [p[0], p[0], p[1]]));
  const rows = SIM.filter(r => r[5] >= 5 && r[1] === state.simTy && r[2] === state.simP && (!state.simHide || r[3] !== 'بدون صف')
                            && (state.simPr === 'ALL' || r[0] === state.simPr));
  let h = '<div class="sectitle" style="margin-top:34px">' + esc(t('simTitle')) + '</div><div class="secsub">' + esc(t('simSub')) + '</div>'
    + '<div class="card">'
    + chips('simTy', SIM_TY) + chips('simP', SIM_P) + chips('simPr', prs)
    + '<label style="font-size:12.5px;color:var(--mut);cursor:pointer"><input type="checkbox" ' + (state.simHide ? 'checked ' : '') + 'onchange="setSim(\'simHide\',this.checked)"> ' + esc(A ? 'إخفاء «بدون صف»' : 'Hide "No grade"') + '</label>'
    + '</div>';
  if(!rows.length) return h + '<div class="card" style="margin-top:12px;color:var(--mut)">' + esc(A ? 'لا توجد محاولات لهذا الاختيار.' : 'No attempts for this selection.') + '</div>';
  const grades = [...new Set(rows.map(r => r[3]))].sort((x, y) => simRank(x) - simRank(y));
  const progs = [...new Set(rows.map(r => r[0]))].sort((x, y) => {
    const tot = p => rows.filter(r => r[0] === p).reduce((q, r) => q + r[5], 0); return tot(y) - tot(x); });
  const mx = Math.max.apply(null, rows.map(r => r[5]));
  const cell = (p, g) => {
    const r = rows.find(x => x[0] === p && x[3] === g);
    if(!r) return '<td class="num" style="color:var(--mut)">—</td>';
    const a = Math.round(8 + 52 * r[5] / mx);
    return '<td class="num" title="' + esc((A ? 'عدد الاختبارات: ' : 'Assessments: ') + r[4]) + '" style="background:color-mix(in srgb,var(--blue) ' + a + '%,transparent)"><b>' + bd(num(r[5])) + '</b></td>';
  };
  const head = '<tr><th>' + esc(A ? 'البرنامج' : 'Programme') + '</th>' + grades.map(g => '<th class="num">' + bd(esc(simGrade(g))) + '</th>').join('') + '</tr>';
  const body = progs.map(p => '<tr><td class="namecell">' + bd(esc(A ? p : (SIM_PR.find(x => x[0] === p) || [0, p])[1])) + '</td>' + grades.map(g => cell(p, g)).join('') + '</tr>').join('');
  h += '<div class="card" style="margin-top:12px"><div class="tscroll"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
    + '<div class="legend" style="display:block;line-height:1.9"><div>' + (A
      ? '<b>الصف = الصف الحالي للطالب</b> لا صفه وقت المحاولة، ولهذا يظهر «خريج». <b>«حلّ الاختبار»</b> = للطالب سطر واحد على الأقل في سجل المحاولات. التشخيصي والمحاكي لا يُجدولان على الفصل، فالمصدر هو من حلّ فعلًا لا من أُسند إليه.'
      : '<b>Grade = the student\'s current grade</b>, not the grade at the time of the attempt, which is why "Graduated" appears. <b>"Sat the exam"</b> = at least one attempt row. Diagnostics and simulators are not scheduled on classes, so this counts who actually sat, not who was assigned.')
    + '</div><div>' + (A
      ? 'عدد الطلاب المختلفين في كل خلية؛ لا تُجمع الأرقام عبر البرامج لأن الطالب قد يحلّ أكثر من برنامج. خلايا أقل من 5 طلاب مخفية. «بدون صف» غالبًا طلاب التطبيق. مرّر على الخلية لعدد الاختبارات.'
      : 'Distinct students per cell; never add across programmes, one student can sit several. Cells under 5 students are hidden. "No grade" is mostly app students. Hover a cell for the number of assessments.') + '</div></div></div>';
  return h;
}

/* ---------- needs follow-up ---------- */
function rankedIssues(list){
  const out = [];
  list.forEach(c => {
    const iss = issuesOf(c, 'campus');
    if(iss.length){
      const lds = leadsOfCampus(c.id).map(l => l.name);
      const mgs = mgrIds(c).map(id => MNAME[id]).filter(Boolean);
      out.push({kind:'campus', name:c.name, row:c, iss, sev:iss.reduce((s,i) => s + i.sev, 0),
        sub:(ar()?'مدير: ':'mgr: ') + (mgs.join('، ') || '—')
          + (ar()?' · قائد: ':' · lead: ') + (lds.join('، ') || (ar()?'بلا قائد':'none'))
          + ' · ' + c.facs + ' ' + t('facs') + ' · ' + c.enr + ' ' + t('students')});
    }
  });
  const cids = new Set(list.map(c => c.id));
  FA.filter(f => cids.has(f.cid)).forEach(f => {
    const iss = issuesOf(f, 'fac');
    if(iss.length) out.push({kind:'fac', name:f.fname, sub:(ar()?'مشرف · ':'Facilitator · ') + ((CBY[f.cid]||{}).name || '') + ' · ' + f.n + ' ' + t('students'),
      row:f, iss, sev:iss.reduce((s,i) => s + i.sev, 0)});
  });
  /* Floor and tiers read off the real severity spread (max 7.6, p05 3.1, p20 2.0,
     p35 0.95). Below 1.0 the gap is noise, and a lone survey-coverage flag is a
     reporting gap rather than a performance problem — neither earns a row. */
  return out
    .filter(x => x.sev >= 1.0 && !x.iss.every(i => i.k === 'survey'))
    .sort((a,b) => b.sev - a.sev);
}
const tierOf = sev => sev >= 3.1 ? 'urgent' : sev >= 2.0 ? 'high' : 'watch';
function issueRow(x){
  const tier = tierOf(x.sev);
  const tl = {urgent:[ar()?'عاجل':'Urgent','p-red'], high:[ar()?'مرتفع':'High','p-amber'], watch:[ar()?'للمتابعة':'Watch','p-blue']}[tier];
  const acts = x.iss.slice().sort((a,b) => b.sev - a.sev).slice(0, 3);
  return '<div class="srow ' + tier + '">'
    + '<div class="srow-top"><span style="font-size:16px">' + (x.kind === 'campus' ? '🏫' : '🎓') + '</span>'
    + '<div><div class="srow-name">' + bd(esc(x.name)) + '</div><div class="srow-meta">' + bd(esc(x.sub)) + '</div></div>'
    + '<span class="pill ' + tl[1] + '" style="margin-inline-start:auto">' + esc(tl[0]) + '</span></div>'
    + '<div class="srow-tags">' + x.iss.map(i => '<span class="dtag' + (i.sev < 1.5 ? ' warn' : '') + '"><b>' + i.txt + '</b></span>').join('') + '</div>'
    + acts.map(i => '<div class="srow-act"><b>' + esc(t('action')) + ':</b> ' + esc(actText(i, x.name)) + '</div>').join('') + '</div>';
}

  }
  const cids = new Set(managerCampuses(state.manager).filter(c => !state.fCampus.length || state.fCampus.includes(String(c.id))).map(c => c.id));
  const seen = {};
  FA.filter(f => cids.has(f.cid)).forEach(f => { seen[f.fid] = f.fname; });
  return Object.entries(seen).map(([v,l]) => ({v, l})).sort((a,b) => a.l.localeCompare(b.l));
}
function ms(kind, label){
  const sel = state[kind], opts = msOptions(kind), open = state.openMS === kind;
  const cap = !sel.length ? label : sel.length === 1 ? ((opts.find(o => o.v === sel[0]) || {l:sel[0]}).l)
            : label + ' · ' + sel.length + ' ' + t('selected');
  let panel = '';
  if(open){
    const q = state.msSearch.toLowerCase();
    const rows = opts.filter(o => !q || o.l.toLowerCase().includes(q)).slice(0, 400);
    panel = '<div class="mspanel" onclick="event.stopPropagation()">'
      + '<input class="mssearch" placeholder="' + esc(t('search')) + '" value="' + esc(state.msSearch) + '" oninput="msSearch(this.value)" autofocus>'
      + '<div class="msrows">' + (rows.length ? rows.map(o => '<div class="msrow ' + (sel.includes(o.v) ? 'on' : '') + '" onclick="msToggle(\'' + kind + '\',\'' + esc(o.v) + '\')">'
          + '<span class="ck">' + (sel.includes(o.v) ? '✓' : '') + '</span>' + bd(esc(o.l)) + '</div>').join('')
          : '<div style="padding:10px;color:var(--mut);font-size:12px">—</div>') + '</div>'
      + (sel.length ? '<div class="msclear" onclick="msClear(\'' + kind + '\')">' + esc(t('clear')) + '</div>' : '') + '</div>';
  }
  return '<div class="ms"><button class="mstrig ' + (sel.length ? 'has' : '') + '" onclick="msOpen(event,\'' + kind + '\')">'
    + bd(esc(cap)) + ' <span style="font-size:9px">▾</span></button>' + panel + '</div>';
}
function msOpen(e, kind){ e.stopPropagation(); state.openMS = state.openMS === kind ? null : kind; state.msSearch = ''; renderBar(); }
function msSearch(v){ state.msSearch = v; renderBar(); const i = document.querySelector('.mssearch'); if(i){ i.focus(); i.setSelectionRange(v.length, v.length); } }
function msToggle(kind, v){
  const a = state[kind], i = a.indexOf(v);
  if(i < 0) a.push(v); else a.splice(i, 1);
  if(kind === 'fLead')   { state.fCampus = []; state.fFac = []; }
  if(kind === 'fCampus') state.fFac = [];
  render();
}
function msClear(kind){ state[kind] = [];
  if(kind === 'fLead'){ state.fCampus = []; state.fFac = []; }
  if(kind === 'fCampus') state.fFac = [];
  render(); }
function clearAll(){ state.fType = 'ALL'; state.fLead = []; state.fCampus = []; state.fFac = []; state.openMS = null; render(); }
document.addEventListener('click', () => { if(state.openMS){ state.openMS = null; renderBar(); } });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && state.drill) closeDrill(); });

function filterBar(){
  const any = state.fType !== 'ALL' || state.fLead.length || state.fCampus.length || state.fFac.length;
  const all = managerCampuses(state.manager);
  const cnt = v => v === 'ALL' ? all.length : all.filter(c => c.type === v).length;
  const tbtn = (v, lbl) => '<button class="' + (state.fType === v ? 'on' : '') + '" onclick="setType(\'' + v + '\')">'
      + esc(lbl) + ' <span style="opacity:.7;font-weight:600">' + bd(cnt(v)) + '</span></button>';
  const vb = (v, lbl, ic) => '<button class="' + (state.viewBy === v ? 'on' : '') + '" onclick="setViewBy(\'' + v + '\')">'
      + ic + ' ' + esc(lbl) + '</button>';
  return '<span class="flabel">' + esc(t('viewBy')) + '</span>'
    + '<div class="seg">' + vb('people', t('byPeople'), '👥') + vb('school', t('bySchool'), '🏫') + '</div>'
    + '<span class="flabel" style="margin-inline-start:6px">' + esc(t('ctype')) + '</span>'
    + '<div class="seg">' + tbtn('ALL', t('tAll')) + tbtn('TRACKS', t('tTracks')) + tbtn('UFFUQ', t('tUffuq')) + '</div>'
    + '<span class="flabel" style="margin-inline-start:6px">' + (ar() ? 'تصفية:' : 'Filter:') + '</span>'
    + ms('fLead', t('lead')) + ms('fCampus', t('school')) + ms('fFac', t('facilitator'))
    + (any ? '<button class="ghost" onclick="clearAll()">✕ ' + esc(t('clear')) + '</button>' : '')
    + '<span style="margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
    + '<span class="flabel">' + esc(t('compare')) + '</span>'
    + '<div class="seg">'
    + '<button class="' + (state.cmp === 'week' ? 'on' : '') + '" onclick="setCmp(\'week\')">' + esc(t('lastWeek')) + '</button>'
    + '<button class="' + (state.cmp === 'sem' ? 'on' : '') + '" onclick="setCmp(\'sem\')">' + esc(t('semStart')) + '</button>'
    + '</div></span>';
}
function crumb(){
  const list = scopedCampuses(), a = agg(list);
  const who = state.manager === 'ALL' ? t('allNet') : MNAME[state.manager];
  const ty = state.fType === 'ALL' ? null : (state.fType === 'TRACKS' ? t('tTracks') : t('tUffuq'));
  return [who, ty, list.length + ' ' + t('schools'), num(a.enr) + ' ' + t('students'),
          uniq(scopedFacs().map(f => f.fid)).length + ' ' + t('facs')]
    .filter(Boolean).map(p => bd(esc(p))).join(' <span style="opacity:.5">·</span> ');
}

function renderBar(){ document.getElementById('filterbar').innerHTML = filterBar(); }
function render(){
  const root = document.getElementById('root');
  root.dir = ar() ? 'rtl' : 'ltr';
  document.documentElement.lang = state.lang;
  document.getElementById('h-title').textContent = t('title');
  document.getElementById('h-sub').textContent = t('sub');
  const list = scopedCampuses(), a = agg(list);
  document.getElementById('h-stat').innerHTML =
      bd(num(a.enr)) + ' ' + esc(t('students')) + ' · ' + bd(list.length) + ' ' + esc(t('schools'))
    + ' · ' + bd(uniq(scopedFacs().map(f => f.fid)).length) + ' ' + esc(t('facs'))
    + '<br><span style="opacity:.85">' + esc(state.manager === 'ALL' ? t('allNet') : MNAME[state.manager]) + '</span>'
    + '<br><span style="opacity:.7">' + bd(META.window_start + ' → ' + META.window_end) + '</span>';
  document.getElementById('topbar').innerHTML = topbar();
  document.getElementById('sidebar').innerHTML = sidebar();
  renderBar();
  document.getElementById('crumb').innerHTML = crumb();
  const views = {exec:viewExec, schools:viewSchools, leads:viewLeads, exams:viewExams, facs:viewFacs, action:viewAction};
  const personalNotice = DATA.viewer?.userType === 'FACILITATOR'
    ? '<div class="card"><div class="secsub">' + (ar()
      ? 'تعرض هذه الصفحة بيانات طلابك فقط. إجماليات اختبارات المدرسة والمؤشرات الأسبوعية للمدير غير متاحة في هذا العرض. استخدم تغيير الملف الشخصي لعرض بيانات حساب آخر تملكه.'
      : 'This page shows only your students. School exam totals and manager weekly trends are unavailable in this view. Use Switch profile to view another account you own.') + '</div></div>' : '';
  document.getElementById('app').innerHTML = personalNotice + (views[state.tab] || viewExec)();
  renderDrill();
  tipHide();
}
render();
</script>
